<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELLIX FF - Tournament Registration</title>
<style>
:root{--bg:#0a0a0a;--card:#161616;--line:#2a2a2a;--text:#f4f4f4;--muted:#a0a0a0;--y:#ffc800;--red:#ff4d4d;--ok:#3ccf91}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0 6px}
h1{font-family:Impact,Arial Black,sans-serif;font-size:38px;margin:0;letter-spacing:1px;font-style:italic}
h1 span{color:var(--y)}
.back{display:inline-block;color:var(--y);text-decoration:none;font-size:14px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{border-left:4px solid var(--y);padding-left:10px;font-size:20px;margin:0 0 12px}
.big{font-size:22px;font-weight:700}
.bar{height:12px;background:#0f0f0f;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--y);width:0;transition:width .3s}
.bar>i.full{background:var(--red)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kv span{display:block;color:var(--muted);font-size:12px}
.status{margin-top:10px;font-weight:700}
.status.open{color:var(--ok)} .status.closed{color:var(--red)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;background:#0f0f0f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font-size:16px;font-family:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--y);outline-offset:1px}
button{width:100%;margin-top:16px;background:var(--y);color:#000;border:0;border-radius:8px;padding:13px;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{padding:12px;border-radius:8px;margin-top:12px;font-size:14px}
.msg.err{background:#3a1a1a;color:#ffb3b3}
.msg.ok{background:#12301f;color:#a8f0cf}
.empty{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>SELLIX <span>FF</span></h1></header>
  <a class="back" href="./">← Main site par wapas</a>

  <div id="loading" class="empty">Load ho raha hai...</div>
  <div id="none" class="empty hidden">Abhi koi tournament nahi hai. Jaldi naya aayega!</div>

  <div id="content" class="hidden">
    <div id="pickWrap" class="card hidden">
      <label for="pick" style="margin-top:0">Tournament chuno</label>
      <select id="pick"></select>
    </div>

    <div class="card">
      <h2 id="tName"></h2>
      <div class="big" id="tCount"></div>
      <div class="bar"><i id="tFill"></i></div>
      <div class="kv">
        <div><span>💰 Prize Pool</span><b id="tPrize"></b></div>
        <div><span>🎟️ Entry Fee</span><b id="tFee"></b></div>
        <div><span>📅 Date</span><b id="tDate"></b></div>
      </div>
      <div class="status" id="tStatus"></div>
    </div>

    <div class="card">
      <h2>Register karo</h2>
      <form id="form" autocomplete="on" novalidate>
        <label for="fullName" style="margin-top:0">Full Name</label>
        <input id="fullName" maxlength="60" autocomplete="name">
        <label for="uid">Free Fire UID</label>
        <input id="uid" inputmode="numeric" maxlength="14">
        <label for="ign">In-Game Name</label>
        <input id="ign" maxlength="40">
        <label for="mobile">Mobile Number (10 digit)</label>
        <input id="mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national">
        <label for="email">Email</label>
        <input id="email" type="email" maxlength="100" autocomplete="email">
        <button type="submit" id="go">Register karo</button>
        <div id="fmsg"></div>
      </form>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyB8uGrxTOTE2KixYo9pIR7sJ5Adx1Vfo88",
  authDomain: "sellix-ff.firebaseapp.com",
  projectId: "sellix-ff",
  storageBucket: "sellix-ff.firebasestorage.app",
  messagingSenderId: "469342363035",
  appId: "1:469342363035:web:97e2c80ed3a3e107be953e"
});
var db = firebase.firestore();
var TS = firebase.firestore.FieldValue.serverTimestamp;
function $(id){ return document.getElementById(id); }

var list = [], chosen = null, busy = false;

function millis(x){ return x && x.toMillis ? x.toMillis() : 0; }
function fmtDate(s){
  var p = String(s || "").split("-");
  if(p.length !== 3) return s || "-";
  return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString("en-IN", {day: "numeric", month: "long", year: "numeric"});
}
function regState(t){
  var n = t.playerCount || 0, max = t.maxPlayers || 0;
  if(n >= max) return {open: false, label: "🔴 Registration Closed"};
  if(t.registrationClosedManually || !t.registrationOpen) return {open: false, label: "🔴 Registration Closed"};
  if(t.status !== "upcoming" && t.status !== "live") return {open: false, label: "🔴 Registration Closed"};
  return {open: true, label: "🟢 Registration Open"};
}
function pickCurrent(arr){
  var live = arr.filter(function(t){ return t.status === "live"; }).sort(function(a, b){ return millis(b.createdAt) - millis(a.createdAt); });
  if(live.length) return live[0];
  var up = arr.filter(function(t){ return t.status === "upcoming"; }).sort(function(a, b){ return String(a.tournamentDate || "9999").localeCompare(String(b.tournamentDate || "9999")); });
  return up[0] || null;
}
function msg(text, kind){
  var el = $("fmsg"); el.innerHTML = "";
  if(!text) return;
  var d = document.createElement("div"); d.className = "msg " + kind; d.textContent = text; el.appendChild(d);
}

function render(){
  $("loading").classList.add("hidden");
  if(!list.length){ $("none").classList.remove("hidden"); $("content").classList.add("hidden"); return; }
  $("none").classList.add("hidden"); $("content").classList.remove("hidden");

  if(!chosen || !list.some(function(t){ return t.id === chosen; })){ var c = pickCurrent(list); chosen = c ? c.id : list[0].id; }
  if(list.length > 1){
    $("pickWrap").classList.remove("hidden");
    var sel = $("pick"); sel.innerHTML = "";
    list.forEach(function(t){ var o = document.createElement("option"); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });
    sel.value = chosen;
  }else{ $("pickWrap").classList.add("hidden"); }

  var t = list.filter(function(x){ return x.id === chosen; })[0];
  var n = t.playerCount || 0, max = t.maxPlayers || 0, st = regState(t);
  $("tName").textContent = t.name;
  $("tCount").textContent = n >= max ? (n + " / " + max + " Players Registered") : (n + " / " + max + " Players");
  var fill = $("tFill"); fill.style.width = (max ? Math.min(100, Math.round(n / max * 100)) : 0) + "%"; fill.className = n >= max ? "full" : "";
  $("tPrize").textContent = "₹" + Number(t.prizePool || 0).toLocaleString("en-IN");
  $("tDate").textContent = fmtDate(t.tournamentDate);
  $("tFee").textContent = Number(t.entryFee) > 0 ? "₹" + Number(t.entryFee).toLocaleString("en-IN") : "Free";
  var s = $("tStatus"); s.textContent = st.label; s.className = "status " + (st.open ? "open" : "closed");
  $("go").disabled = busy || !st.open;
  $("go").textContent = st.open ? "Register karo" : (n >= max ? "Registration Closed (Full)" : "Registration Closed");
}

db.collection("tournaments").onSnapshot(function(s){
  list = s.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; })
    .filter(function(t){ return t.status === "upcoming" || t.status === "live"; });
  render();
}, function(){
  $("loading").textContent = "Tournament load nahi ho paya. Internet check karke refresh karo.";
});
$("pick").onchange = function(){ chosen = this.value; msg("", ""); render(); };

$("form").onsubmit = async function(e){
  e.preventDefault();
  if(busy) return;
  var d = {
    fullName: $("fullName").value.trim(), uid: $("uid").value.replace(/\D/g, ""),
    inGameName: $("ign").value.trim(), mobile: $("mobile").value.replace(/\D/g, ""), email: $("email").value.trim()
  };
  if(d.fullName.length < 2) return msg("Apna poora naam likho.", "err");
  if(d.uid.length < 6 || d.uid.length > 14) return msg("Free Fire UID sahi daalo (sirf numbers).", "err");
  if(!d.inGameName) return msg("In-game name likho.", "err");
  if(d.mobile.length !== 10) return msg("Mobile number 10 digit ka hona chahiye.", "err");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return msg("Sahi email daalo.", "err");

  var tid = chosen;
  var tRef = db.collection("tournaments").doc(tid);
  var rRef = db.collection("registrations").doc(tid + "_" + d.uid);
  busy = true; $("go").disabled = true; msg("", "");
  try{
    await db.runTransaction(async function(tx){
      var snap = await tx.get(tRef);
      if(!snap.exists) throw new Error("GONE");
      var t = snap.data(), n = t.playerCount || 0;
      if(!regState(t).open) throw new Error(n >= t.maxPlayers ? "FULL" : "CLOSED");
      tx.set(rRef, {fullName: d.fullName, uid: d.uid, inGameName: d.inGameName, mobile: d.mobile, email: d.email, tournamentId: tid, createdAt: TS()});
      tx.update(tRef, {playerCount: n + 1, lastRegId: d.uid});
    });
    $("form").reset();
    msg("✅ Registration ho gayi! Tournament ki details WhatsApp par milengi.", "ok");
  }catch(err){
    var m = err && err.message, code = err && err.code;
    if(m === "FULL") msg("Sorry, saari seats full ho gayi hain. Registration band hai.", "err");
    else if(m === "CLOSED" || m === "GONE") msg("Is tournament ki registration abhi band hai.", "err");
    else if(code === "permission-denied"){
      // Re-check live state to give a precise reason
      try{
        var fresh = (await tRef.get()).data();
        if(fresh && !regState(fresh).open) msg("Registration abhi band ho gayi hai (seats full ya admin ne band ki).", "err");
        else msg("Ye Free Fire UID is tournament mein pehle se registered hai.", "err");
      }catch(x){ msg("Registration nahi ho payi. Dobara try karo.", "err"); }
    }
    else if(code === "unavailable" || code === "network-request-failed") msg("Internet check karo aur dobara try karo.", "err");
    else msg("Registration nahi ho payi. Dobara try karo.", "err");
  }
  busy = false; render();
};
</script>
</body>
  </html>
