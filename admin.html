<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SELLIX FF - Admin</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#eef0f4; --muted:#9097a5;
    --accent:#ffb020; --ok:#3ccf91; --bad:#ff5d5d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;padding-bottom:80px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:4px 0 16px}
  h2{font-size:18px;margin:0 0 12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
  input[type=text],input[type=email],input[type=password],input[type=number],textarea{
    width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#0f1115;color:var(--text);font:inherit}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input[type=file]{width:100%;color:var(--muted);font-size:14px}
  button{font:inherit;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;background:var(--accent);color:#1a1300;font-weight:600}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .row>button{flex:1}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{flex:1;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
  .tabs button.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
  .check{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--text);font-size:16px}
  .check input{width:20px;height:20px}
  .thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:#0f1115}
  .item .info{flex:1;min-width:0}
  .item .t{font-weight:600;overflow-wrap:anywhere}
  .item .m{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .badge.sold{background:#3a1a1a;color:var(--bad)}
  .badge.live{background:#12301f;color:var(--ok)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .acts button{padding:6px 10px;font-size:14px}
  .msg{padding:10px 12px;border-radius:8px;margin-top:12px;font-size:14px}
  .msg.err{background:#3a1a1a;color:#ffb3b3}
  .msg.ok{background:#12301f;color:#a8f0cf}
  .empty{color:var(--muted);text-align:center;padding:16px 0}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .top button{padding:8px 12px;font-size:14px}
  .hidden{display:none}
  #toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:0 auto;padding:12px 14px;border-radius:10px;background:var(--ok);color:#06210f;font-weight:600;display:none;text-align:center}
  #toast.err{background:var(--bad);color:#2a0606}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView" class="hidden">
    <h1>SELLIX FF Admin</h1>
    <div class="panel">
      <h2>Login karo</h2>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" inputmode="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="row"><button id="loginBtn">Login</button></div>
      <div id="loginMsg"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden">
    <div class="top">
      <h1 style="margin:0">SELLIX FF Admin</h1>
      <button class="ghost" id="logoutBtn">Logout</button>
    </div>

    <div class="tabs">
      <button id="tabItems" class="on">Items</button>
      <button id="tabProofs">Proofs</button>
    </div>

    <!-- ITEMS -->
    <section id="itemsSec">
      <div class="panel">
        <h2 id="itemFormTitle">Naya item add karo</h2>
        <label for="iTitle">Item ka naam</label>
        <input id="iTitle" type="text" placeholder="Jaise: Level 70 account">
        <label for="iPrice">Price (₹)</label>
        <input id="iPrice" type="number" inputmode="numeric" min="0">
        <label for="iDesc">Details</label>
        <textarea id="iDesc" placeholder="Level, rank, elite pass, diamonds, etc."></textarea>
        <label for="iPhotos">Photos (max 3)</label>
        <input id="iPhotos" type="file" accept="image/*" multiple>
        <div class="thumbs" id="iThumbs"></div>
        <label class="check"><input id="iSold" type="checkbox"> Sold ho chuka hai</label>
        <div class="row">
          <button id="itemSaveBtn">Item save karo</button>
          <button class="ghost hidden" id="itemCancelBtn">Cancel</button>
        </div>
        <div id="itemMsg"></div>
      </div>

      <div class="panel">
        <h2>Saare items</h2>
        <div id="itemList"><div class="empty">Load ho raha hai...</div></div>
      </div>
    </section>

    <!-- PROOFS -->
    <section id="proofsSec" class="hidden">
      <div class="panel">
        <h2>Naya proof / review add karo</h2>
        <label for="pName">Customer ka naam</label>
        <input id="pName" type="text">
        <label for="pText">Review</label>
        <textarea id="pText"></textarea>
        <label for="pPhoto">Screenshot (optional)</label>
        <input id="pPhoto" type="file" accept="image/*">
        <div class="thumbs" id="pThumbs"></div>
        <div class="row"><button id="proofSaveBtn">Proof save karo</button></div>
        <div id="proofMsg"></div>
      </div>

      <div class="panel">
        <h2>Saare proofs</h2>
        <div id="proofList"><div class="empty">Load ho raha hai...</div></div>
      </div>
    </section>
  </div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB8uGrxTOTE2KixYo9pIR7sJ5Adx1Vfo88",
  authDomain: "sellix-ff.firebaseapp.com",
  projectId: "sellix-ff",
  storageBucket: "sellix-ff.firebasestorage.app",
  messagingSenderId: "469342363035",
  appId: "1:469342363035:web:97e2c80ed3a3e107be953e"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const $ = id => document.getElementById(id);
let editingId = null;
let editingPhotos = [];   // photos already saved on the item being edited
let newPhotos = [];       // freshly chosen photos (data URLs)
let proofPhoto = "";
let unsubItems = null, unsubProofs = null;

/* ---------- helpers ---------- */
function toast(text, isErr){
  const t = $("toast");
  t.textContent = text;
  t.className = isErr ? "err" : "";
  t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.style.display = "none"; }, 2600);
}
function showMsg(id, text, kind){
  const el = $(id);
  el.innerHTML = "";
  if(!text) return;
  const d = document.createElement("div");
  d.className = "msg " + kind;
  d.textContent = text;
  el.appendChild(d);
}
function friendlyError(e){
  const c = (e && e.code) || "";
  if(c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found") || c.includes("invalid-login"))
    return "Email ya password galat hai.";
  if(c.includes("invalid-email")) return "Email ka format galat hai.";
  if(c.includes("too-many-requests")) return "Bahut zyada koshish ho gayi. Thodi der baad try karo.";
  if(c.includes("network")) return "Internet check karo.";
  if(c.includes("permission-denied")) return "Permission nahi mili. Is email ko Firestore rules mein admin banana hoga.";
  if(c.includes("api-key")) return "firebaseConfig ki apiKey galat hai. Dobara copy karo.";
  return (e && e.message) ? e.message : "Kuch galat ho gaya.";
}
function compressImage(file, maxSide, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Photo padh nahi paye."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Ye photo khul nahi rahi."));
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function renderThumbs(el, list){
  el.innerHTML = "";
  list.forEach(src=>{
    const i = document.createElement("img");
    i.src = src; i.alt = "";
    el.appendChild(i);
  });
}
function approxBytes(arr){ return arr.reduce((n,s)=>n+s.length,0); }

/* ---------- auth ---------- */
auth.onAuthStateChanged(user=>{
  if(user){
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    startListening();
  }else{
    $("appView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    stopListening();
  }
});
$("loginBtn").onclick = async ()=>{
  const email = $("email").value.trim();
  const pass = $("password").value;
  if(!email || !pass){ showMsg("loginMsg","Email aur password dono daalo.","err"); return; }
  $("loginBtn").disabled = true;
  showMsg("loginMsg","","");
  try{ await auth.signInWithEmailAndPassword(email, pass); }
  catch(e){ showMsg("loginMsg", friendlyError(e), "err"); }
  $("loginBtn").disabled = false;
};
$("password").addEventListener("keydown", e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = ()=> auth.signOut();

/* ---------- tabs ---------- */
function setTab(which){
  const items = which === "items";
  $("itemsSec").classList.toggle("hidden", !items);
  $("proofsSec").classList.toggle("hidden", items);
  $("tabItems").classList.toggle("on", items);
  $("tabProofs").classList.toggle("on", !items);
}
$("tabItems").onclick = ()=> setTab("items");
$("tabProofs").onclick = ()=> setTab("proofs");

/* ---------- items ---------- */
$("iPhotos").onchange = async e=>{
  const files = Array.from(e.target.files).slice(0,3);
  if(e.target.files.length > 3) toast("Sirf pehli 3 photos li gayi.", true);
  try{
    newPhotos = [];
    for(const f of files) newPhotos.push(await compressImage(f, 700, 0.6));
    renderThumbs($("iThumbs"), newPhotos);
  }catch(err){
    showMsg("itemMsg", err.message, "err");
  }
};

function resetItemForm(){
  editingId = null; editingPhotos = []; newPhotos = [];
  $("iTitle").value = ""; $("iPrice").value = ""; $("iDesc").value = "";
  $("iPhotos").value = ""; $("iSold").checked = false;
  $("iThumbs").innerHTML = "";
  $("itemFormTitle").textContent = "Naya item add karo";
  $("itemSaveBtn").textContent = "Item save karo";
  $("itemCancelBtn").classList.add("hidden");
  showMsg("itemMsg","","");
}
$("itemCancelBtn").onclick = resetItemForm;

$("itemSaveBtn").onclick = async ()=>{
  const title = $("iTitle").value.trim();
  const price = Number($("iPrice").value);
  if(!title){ showMsg("itemMsg","Item ka naam daalo.","err"); return; }
  if(!(price >= 0) || $("iPrice").value === ""){ showMsg("itemMsg","Price daalo.","err"); return; }

  const photos = newPhotos.length ? newPhotos : editingPhotos;
  if(approxBytes(photos) > 850000){
    showMsg("itemMsg","Photos bahut badi hain. Kam ya chhoti photos chuno.","err"); return;
  }
  const data = {
    title, price,
    desc: $("iDesc").value.trim(),
    photos,
    sold: $("iSold").checked
  };
  $("itemSaveBtn").disabled = true;
  try{
    if(editingId){
      await db.collection("items").doc(editingId).update(data);
      toast("Item update ho gaya");
    }else{
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection("items").add(data);
      toast("Item add ho gaya");
    }
    resetItemForm();
  }catch(e){
    showMsg("itemMsg", friendlyError(e), "err");
  }
  $("itemSaveBtn").disabled = false;
};

function renderItems(snap){
  const box = $("itemList");
  box.innerHTML = "";
  if(snap.empty){
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "Abhi koi item nahi hai. Upar se pehla item add karo.";
    box.appendChild(d); return;
  }
  snap.forEach(doc=>{
    const it = doc.data();
    const row = document.createElement("div"); row.className = "item";
    const img = document.createElement("img");
    img.alt = ""; if(it.photos && it.photos[0]) img.src = it.photos[0];
    const info = document.createElement("div"); info.className = "info";
    const t = document.createElement("div"); t.className = "t";
    t.textContent = it.title || "(naam nahi)";
    const b = document.createElement("span");
    b.className = "badge " + (it.sold ? "sold" : "live");
    b.textContent = it.sold ? "Sold" : "Available";
    t.appendChild(b);
    const m = document.createElement("div"); m.className = "m";
    m.textContent = "₹" + (it.price ?? 0) + (it.desc ? " · " + it.desc : "");
    const acts = document.createElement("div"); acts.className = "acts";

    const soldBtn = document.createElement("button"); soldBtn.className = "ghost";
    soldBtn.textContent = it.sold ? "Available karo" : "Sold mark karo";
    soldBtn.onclick = async ()=>{
      try{ await db.collection("items").doc(doc.id).update({sold: !it.sold}); toast("Update ho gaya"); }
      catch(e){ toast(friendlyError(e), true); }
    };
    const editBtn = document.createElement("button"); editBtn.className = "ghost";
    editBtn.textContent = "Edit";
    editBtn.onclick = ()=>{
      editingId = doc.id; editingPhotos = it.photos || []; newPhotos = [];
      $("iTitle").value = it.title || ""; $("iPrice").value = it.price ?? "";
      $("iDesc").value = it.desc || ""; $("iSold").checked = !!it.sold;
      $("iPhotos").value = "";
      renderThumbs($("iThumbs"), editingPhotos);
      $("itemFormTitle").textContent = "Item edit karo";
      $("itemSaveBtn").textContent = "Changes save karo";
      $("itemCancelBtn").classList.remove("hidden");
      showMsg("itemMsg","Nayi photos na chuno to purani photos rahengi.","ok");
      window.scrollTo({top:0, behavior:"smooth"});
    };
    const delBtn = document.createElement("button"); delBtn.className = "danger";
    delBtn.textContent = "Delete";
    delBtn.onclick = async ()=>{
      if(!confirm("Ye item hamesha ke liye delete ho jayega. Pakka?")) return;
      try{ await db.collection("items").doc(doc.id).delete(); toast("Delete ho gaya"); }
      catch(e){ toast(friendlyError(e), true); }
    };
    acts.append(soldBtn, editBtn, delBtn);
    info.append(t, m, acts);
    row.append(img, info);
    box.appendChild(row);
  });
}

/* ---------- proofs ---------- */
$("pPhoto").onchange = async e=>{
  const f = e.target.files[0];
  proofPhoto = "";
  if(!f){ $("pThumbs").innerHTML = ""; return; }
  try{
    proofPhoto = await compressImage(f, 700, 0.6);
    renderThumbs($("pThumbs"), [proofPhoto]);
  }catch(err){ showMsg("proofMsg", err.message, "err"); }
};
$("proofSaveBtn").onclick = async ()=>{
  const name = $("pName").value.trim();
  const text = $("pText").value.trim();
  if(!name && !text && !proofPhoto){ showMsg("proofMsg","Naam, review ya screenshot mein se kuch to daalo.","err"); return; }
  $("proofSaveBtn").disabled = true;
  try{
    await db.collection("proofs").add({
      name, text, photo: proofPhoto,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    $("pName").value = ""; $("pText").value = ""; $("pPhoto").value = "";
    $("pThumbs").innerHTML = ""; proofPhoto = "";
    showMsg("proofMsg","","");
    toast("Proof add ho gaya");
  }catch(e){ showMsg("proofMsg", friendlyError(e), "err"); }
  $("proofSaveBtn").disabled = false;
};
function renderProofs(snap){
  const box = $("proofList");
  box.innerHTML = "";
  if(snap.empty){
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "Abhi koi proof nahi hai.";
    box.appendChild(d); return;
  }
  snap.forEach(doc=>{
    const p = doc.data();
    const row = document.createElement("div"); row.className = "item";
    const img = document.createElement("img"); img.alt = "";
    if(p.photo) img.src = p.photo; else img.style.visibility = "hidden";
    const info = document.createElement("div"); info.className = "info";
    const t = document.createElement("div"); t.className = "t"; t.textContent = p.name || "(naam nahi)";
    const m = document.createElement("div"); m.className = "m"; m.textContent = p.text || "";
    const acts = document.createElement("div"); acts.className = "acts";
    const del = document.createElement("button"); del.className = "danger"; del.textContent = "Delete";
    del.onclick = async ()=>{
      if(!confirm("Ye proof delete karna hai?")) return;
      try{ await db.collection("proofs").doc(doc.id).delete(); toast("Delete ho gaya"); }
      catch(e){ toast(friendlyError(e), true); }
    };
    acts.appendChild(del);
    info.append(t, m, acts);
    row.append(img, info);
    box.appendChild(row);
  });
}

/* ---------- live lists ---------- */
function startListening(){
  stopListening();
  unsubItems = db.collection("items").orderBy("createdAt","desc").onSnapshot(renderItems,
    e=>{ $("itemList").textContent = friendlyError(e); });
  unsubProofs = db.collection("proofs").orderBy("createdAt","desc").onSnapshot(renderProofs,
    e=>{ $("proofList").textContent = friendlyError(e); });
}
function stopListening(){
  if(unsubItems){ unsubItems(); unsubItems = null; }
  if(unsubProofs){ unsubProofs(); unsubProofs = null; }
}
</script>
</body>
</html>
