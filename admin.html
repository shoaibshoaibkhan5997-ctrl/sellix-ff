<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELLIX FF - Admin helper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h2>Admin: naya item ka code banao</h2>
<form id="af">
<input id="at" placeholder="Title (jaise Level 70 ID)" required>
<input id="ap" type="number" placeholder="Price (Rs)" required>
<textarea id="ad" rows="2" placeholder="Details: bundles, guns, rank..."></textarea>
<label style="font-size:14px;color:var(--muted)">Photos chuno (max 3)</label>
<input id="af2" type="file" accept="image/*" multiple required>
<button class="btn" type="submit">Code banao</button>
</form>
<div id="out" style="display:none">
<h2>Ye line items.json me daalo</h2>
<textarea id="code" rows="8" readonly></textarea>
<div class="note" style="margin-top:10px">1) Photos GitHub me <b>images</b> folder me upload karo (wahi naam).<br>2) items.json kholo, [ ke baad ye code paste karo. Pehle se item ho to end me comma (,) lagana.</div>
</div>
</div>
<script>
document.getElementById("af").onsubmit=function(e){
e.preventDefault();
var names=Array.from(document.getElementById("af2").files).slice(0,3).map(function(f){return f.name.replace(/\s+/g,"-")});
var o={title:at.value,type:"Account",price:ap.value,desc:ad.value,imgs:names};
document.getElementById("code").value=JSON.stringify(o,null,2);
document.getElementById("out").style.display="block";
};
</script>
</body>
</html>
